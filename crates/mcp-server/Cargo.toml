[package]
name = "diskrookie-mcp"
version = "0.1.0"
edition = "2021"
description = "DiskRookie MCP server (stdio) - AI 磁盘清理专家工具集"

[[bin]]
name = "diskrookie-mcp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde_json = "1"
regex = "1"
encoding_rs = "0.8"

# Workspace crates（依赖方向：common → domain-model → disk-scanner → mcp-server；executor 供写操作）
ai-disk-common = { path = "../common" }
ai-disk-domain = { path = "../domain-model" }
ai-disk-scanner = { path = "../disk-scanner" }
ai-disk-executor = { path = "../executor" }

[dev-dependencies]
tempfile = "3"
